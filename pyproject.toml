[project]
name = "stylespeak"
version = "0.1.0"
description = "Local Zalando product dataset pipeline and Streamlit e-commerce catalog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.30.0",
    "pillow>=12.3.0",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
