[project]
name = "stylespeak"
version = "1.0.0"
description = "Local-first AI fashion shopping assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "faster-whisper>=1.2.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/stylespeak_api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests_backend"]
pythonpath = ["."]
